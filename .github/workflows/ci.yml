name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base, so stacked layers get CI too.
  pull_request:
    # `edited`: the policy job lints the PR title and body. `ready_for_review`:
    # the checklist step is skipped while the PR is a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The merge discipline GitHub has no setting for. Steps are conditional, the
  # job is not: a skipped required check would block a PR forever.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The PR title becomes the squash subject and the changelog entry.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: '$TITLE'"
            exit 1
          fi
          echo "ok: $TITLE"

      - name: Branch was rebased, not merged into
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          merges="$(git log --merges --oneline "origin/$BASE_REF..$HEAD_SHA")"
          if [ -n "$merges" ]; then
            echo "::error::This branch contains merge commits from its base. Rebase instead: git fetch origin && git rebase origin/$BASE_REF"
            echo "$merges"
            exit 1
          fi
          echo "ok: no merge commits"

      - name: Definition of done is complete
        # Skipped for drafts (a draft cannot merge) and for bots.
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Fenced code blocks are blanked first, so an example checklist in the
          # body does not block the PR.
          unticked="$(printf '%s' "$BODY" \
            | awk '/^[[:space:]]*```/ { f = !f; print ""; next } f { print ""; next } { print }' \
            | grep -nE '^[[:space:]]*- \[ \]' || true)"
          if [ -n "$unticked" ]; then
            echo "::error::Unticked checkboxes remain in the PR description."
            echo "$unticked"
            exit 1
          fi
          echo "ok: no unticked checkboxes"

  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            # A push to main: the commits it brought, or the tip alone on the
            # first push (no parent to compare with).
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              npx commitlint --from "$BEFORE" --to HEAD --verbose
            else
              npx commitlint --last --verbose
            fi
          fi

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Markdown lint
        run: make lint
      - name: Links and anchors (offline, as make links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments --exclude-path node_modules './**/*.md'
          fail: true

  # The one required check. Green only if every job above succeeded: failure,
  # cancelled and skipped all fail it.
  ci-required:
    if: always()
    needs: [policy, commitlint, markdown]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
