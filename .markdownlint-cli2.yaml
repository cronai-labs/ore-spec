# Markdown lint for the specification and its examples.
config:
  default: true
  # Prose is soft-wrapped: one line per paragraph.
  MD013: false
  # The spec repeats subsection names (Fields, Examples) under different parents.
  MD024:
    siblings_only: true
  # Table pipe spacing is not enforced: tables use the compact |---| separators.
  MD060: false
  # Examples are workflow notes: they start with front matter, not a heading.
  MD041: false
globs:
  - "**/*.md"
ignores:
  - node_modules/**
  # Generated by git-cliff at release time.
  - CHANGELOG.md
